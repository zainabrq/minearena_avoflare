<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avoflare | Clinician Dashboard Demo</title>
<style>
:root {
  --paper: #fff; --quiet: #f4f5f3; --sage: #e7efe9; --green: #174b38;
  --ink: #000; --muted: #46534b; --line: #dde3dd; --review: #9a5800; --urgent: #b42318;
  font: 16px/1.55 Manrope, system-ui, Arial, sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { color: var(--green); line-height: 1.2; }
h1 { font-size: clamp(30px, 4vw, 40px); letter-spacing: -.045em; }
h2 { font-size: 25px; letter-spacing: -.025em; }
h3 { font-size: 19px; }
button, input, select { font: inherit; color: inherit; }
button, input, select {
  min-height: 44px; padding: 8px 13px; border: 1px solid #a4afa6;
  border-radius: 12px; background: white;
}
button { cursor: pointer; font-weight: 650; }
button:hover:not(:disabled) { background: var(--sage); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--green); outline-offset: 3px;
}
button.primary { background: var(--green); color: white; border-color: var(--green); }
button.primary:hover:not(:disabled) { background: #246047; }
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
aside {
  position: sticky; top: 0; height: 100vh; padding: 24px 16px;
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px;
}
.brand { display: block; width: 176px; max-height: 80px; object-fit: contain; }
nav { display: grid; gap: 4px; }
nav button { text-align: left; border-color: transparent; }
nav button[aria-current=page] { background: var(--sage); color: var(--green); }
.footnote { margin-top: auto; color: var(--muted); font-size: 14px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
main { width: 100%; max-width: 1600px; padding: 28px 32px 48px; }
.banner { padding: 10px 16px; background: var(--sage); border-radius: 12px; font-size: 14px; color: var(--green); margin-bottom: 24px; }
.heading, .section-head, .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.heading { margin-bottom: 24px; }
.heading p, .section-head p { margin-top: 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-block: 1px solid var(--line); background: var(--quiet); margin: 0 0 24px; }
.stats div { padding: 12px 16px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-size: 26px; }
.panel { border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }
.queue { padding-bottom: 4px; }
.filters { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; margin: 16px 0 8px; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
label input, label select { font-size: 16px; font-weight: 400; max-width: 100%; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 14px; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--quiet); }
.link { min-height: 44px; color: var(--green); border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; background: transparent; }
.status { font-weight: 700; }
.status.review { color: var(--review); }
.status.urgent { color: var(--urgent); }
.detail, .replay { display: grid; grid-template-columns: minmax(0, 7fr) minmax(300px, 5fr); gap: 20px; align-items: start; }
.stack { display: grid; gap: 16px; }
.vitals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.vital { background: white; padding: 16px; min-width: 0; }
.value { font-size: clamp(26px, 3.2vw, 46px); font-weight: 650; letter-spacing: -.045em; line-height: 1.2; font-variant-numeric: tabular-nums; margin: 8px 0; }
.value.missing { font-size: 22px; }
.value small { font-size: 14px; font-weight: 500; letter-spacing: 0; }
svg { display: block; width: 100%; height: auto; margin-top: 10px; }
svg text { font-family: system-ui, sans-serif; fill: var(--muted); }
dl { margin: 0; }
dt { font-weight: 700; margin-top: 12px; }
dd { margin: 2px 0 0; }
.assessment { background: var(--quiet); }
.assessment h2 { margin-bottom: 8px; }
.events { list-style: none; padding: 0; margin: 8px 0 0; }
.events li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.events li:last-child { border: 0; }
.events time { display: block; }
progress { width: 100%; height: 14px; accent-color: var(--green); }
.panel > p + p, .panel > p + .actions { margin-top: 12px; }
.panel h2 + p { margin-top: 8px; }
.section-head + .stack { margin-top: 16px; }
form .actions { justify-content: start; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 2; background: white; padding: 8px; }
@media (max-width: 1120px) { .shell { grid-template-columns: 180px minmax(0, 1fr); } .brand { width: 145px; } main { padding-inline: 24px; } }
@media (max-width: 900px) { .detail, .replay { grid-template-columns: 1fr; } .assessment-stack { grid-row: 1; } }
@media (max-width: 680px) {
  .shell { display: block; } aside { position: static; height: auto; gap: 8px; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--line); }
  .brand { width: 125px; max-height: 52px; } nav { display: flex; flex-wrap: wrap; } nav button { padding-inline: 8px; font-size: 14px; }
  .footnote { padding: 4px 0; border: 0; } main { padding: 16px; } .stats { grid-template-columns: repeat(2, 1fr); }
  .stats div { padding: 8px; } .stats div + div { border-left: 0; } .vital, .panel { padding: 12px; }
}
</style>
</head>

<script>
'use strict';

const metrics = [
  { label: 'Heart rate', short: 'HR', unit: 'bpm', range: [55, 135], noise: 3, shift: 36 },
  { label: 'Respiratory rate', short: 'RR', unit: '/min', range: [10, 35], noise: 1, shift: 12 },
  { label: 'Oxygen saturation', short: 'SpO₂', unit: '%', range: [85, 100], noise: .6, shift: -8 },
  { label: 'Temperature', short: 'Temp', unit: '°C', range: [35, 40], noise: .15, shift: 1.2 },
];

const patients = [
  { id: 'DEMO-001', context: 'Respiratory recovery', baseline: [83, 17, 97, 37.1] },
  { id: 'DEMO-002', context: 'Post-discharge follow-up', baseline: [76, 16, 98, 36.7] },
  { id: 'DEMO-003', context: 'Cardiac follow-up', baseline: [91, 18, 97, 36.9] },
  { id: 'DEMO-004', context: 'General recovery', baseline: [72, 15, 99, 36.6] },
  { id: 'DEMO-005', context: 'Respiratory follow-up', baseline: [86, 18, 96, 37.0] },
];

const scenarios = {
  stable: 'Stable recovery',
  slow: 'Slow deterioration',
  probe: 'Probe removal',
};

const view = document.querySelector('#view');
const state = { page: 'overview', patient: 0, scenario: 'slow', run: null, search: '', priority: 'all', alertType: 'clinical' };
const totalSteps = 30;
let timer;

function reading(patient, shift = 0, probeOff = false) {
  return metrics.map((metric, index) => {
    if (probeOff && index === 2) return null;
    const value = patient.baseline[index] + metric.shift * shift + metric.noise * (Math.random() * 2 - 1);
    return index === 3 ? Number(value.toFixed(1)) : Math.round(value);
  });
}

const initial = patients.map(patient => Array.from({ length: 31 }, (_, i) => ({
  t: (i - 30) * 30, values: reading(patient),
})));

function fixture(patientIndex) {
  return state.run?.patient === patientIndex ? state.run : null;
}

function samples(patientIndex) {
  return fixture(patientIndex)?.samples ?? initial[patientIndex];
}

function formatTime(seconds) {
  const sign = seconds < 0 ? '−' : '';
  const minutes = Math.floor(Math.abs(seconds) / 60);
  const remainder = Math.abs(seconds) % 60;
  return sign + String(minutes).padStart(2, '0') + ':' + String(remainder).padStart(2, '0');
}

function priority(run) {
  return run?.events.findLast(event => event.type === 'clinical')?.priority ?? 'Watch';
}

function status(value) {
  return '<span class="status ' + value.toLowerCase() + '">' + value + '</span>';
}

function heading(title, description, action = '') {
  return '<header class="heading"><div><h1 tabindex="-1">' + title + '</h1><p class="muted">' + description + '</p></div>' + action + '</header>';
}

function getRows() {
  const query = state.search.trim().toLowerCase();
  const rank = { Urgent: 0, Review: 1, Watch: 2 };
  return patients.map((patient, index) => {
    const run = fixture(index);
    return { patient, index, priority: priority(run), latest: samples(index).at(-1), interrupted: Boolean(run?.probeOff) };
  }).sort((a, b) => rank[a.priority] - rank[b.priority] || b.latest.t - a.latest.t || a.index - b.index)
    .filter(row => (state.priority === 'all' || row.priority === state.priority)
      && (row.patient.id + ' ' + row.patient.context).toLowerCase().includes(query));
}

function paintOverview() {
  const summary = [
    ['Demo patients', patients.length],
    ...['Watch', 'Review', 'Urgent'].map(level => [level, patients.filter((_, i) => priority(fixture(i)) === level).length]),
    ['Interrupted', patients.filter((_, i) => fixture(i)?.probeOff).length],
  ];
  document.querySelector('#stats').innerHTML = summary.map(([label, value]) => '<div><span class="small">' + label + '</span><b>' + value + '</b></div>').join('');
  document.querySelector('#patient-rows').innerHTML = getRows().map(row => `
    <tr><td><button class="link" type="button" data-patient="${row.index}">${row.patient.id}</button></td>
    <td>${row.patient.context}</td>
    ${row.latest.values.map(value => '<td>' + (value ?? 'Unavailable') + '</td>').join('')}
    <td>${status(row.priority)}</td><td>${row.interrupted ? 'Signal interrupted' : 'Available'}</td>
    <td>${formatTime(row.latest.t)}</td></tr>`
  ).join('') || '<tr><td colspan="9">No demo patients match these filters.</td></tr>';
}

function overview() {
  view.innerHTML = heading('Post-discharge monitoring', 'Clinician workspace for the MineArena round-two demo.',
    '<button class="primary" type="button" data-view="replay">Open scenario replay</button>') + `
    <div class="stats" id="stats" aria-label="Cohort summary"></div>
    <section class="panel queue" aria-labelledby="queue-title">
      <div class="section-head"><div><h2 id="queue-title">Patient queue</h2>
      <p class="muted small">Select a patient to inspect trends and alert evidence.</p></div></div>
      <div class="filters">
        <label>Search patients <input id="search" type="search" placeholder="Patient ID or context"></label>
        <label>Priority <select id="priority"><option value="all">All priorities</option><option>Watch</option><option>Review</option><option>Urgent</option></select></label>
      </div>
      <div class="table-wrap" role="region" aria-label="Demo patient readings" tabindex="0">
        <table><thead><tr><th>Patient</th><th>Demo context</th><th>HR (bpm)</th><th>RR (/min)</th>
        <th>SpO₂ (%)</th><th>Temp (°C)</th><th>Priority</th><th>Monitoring</th><th>Source time</th></tr></thead>
        <tbody id="patient-rows"></tbody></table>
      </div>
    </section>`;
  document.querySelector('#search').value = state.search;
  document.querySelector('#priority').value = state.priority;
  paintOverview();
}

function chart(history, index) {
  const metric = metrics[index];
  const visible = history.slice(-31);
  const [low, high] = metric.range;
  const x = i => 30 + i * 232 / (visible.length - 1);
  const y = value => 75 - (value - low) * 61 / (high - low);
  let previous = null;
  const path = visible.map((sample, i) => {
    const value = sample.values[index];
    const command = previous === null ? 'M' : 'L';
    previous = value;
    return value === null ? '' : command + x(i).toFixed(1) + ',' + y(value).toFixed(1);
  }).join(' ');
  const baseline = patients[state.patient].baseline[index];
  return `<svg viewBox="0 0 280 100" role="img" aria-label="${metric.label}, last 15 minutes of simulated source time. Gaps indicate unavailable readings.">
    <path d="M30 14H262 M30 75H262" stroke="#dde3dd"/>
    <path d="M30 ${y(baseline)}H262" stroke="#78867d" stroke-dasharray="4 4"/>
    <path d="${path}" fill="none" stroke="#174b38" stroke-width="2"/>
    <text x="0" y="18" font-size="11">${high}</text><text x="0" y="79" font-size="11">${low}</text>
    <text x="30" y="94" font-size="11">${formatTime(visible[0].t)}</text>
    <text x="262" y="94" text-anchor="end" font-size="11">${formatTime(visible.at(-1).t)}</text>
  </svg>`;
}

function evidence(event) {
  return `<dl><dt>Triggering reading</dt><dd>${event.reading} at ${formatTime(event.t)} source time</dd>
    <dt>Applied demo rule</dt><dd>${event.rule}</dd>
    <dt>Relevant demo fact</dt><dd>${event.fact}</dd></dl>`;
}

function paintMonitor() {
  const patient = patients[state.patient];
  const run = fixture(state.patient);
  const history = samples(state.patient);
  const current = history.at(-1);
  document.querySelector('#vitals').innerHTML = metrics.map((metric, i) => {
    const value = current.values[i];
    const baseline = patient.baseline[i];
    const difference = value === null ? null : Number((value - baseline).toFixed(1));
    const delta = difference === null ? '' : ' · Δ ' + (difference > 0 ? '+' : '') + difference + (i === 2 ? ' pp' : '');
    return `<article class="vital"><h3>${metric.label}</h3>
      <p class="value ${value === null ? 'missing' : ''}">${value ?? 'Unavailable'} ${value === null ? '' : '<small>' + metric.unit + '</small>'}</p>
      <p class="small muted">Demo baseline ${baseline} ${metric.unit}${delta}</p>
      ${chart(history, i)}</article>`;
  }).join('');
  const alert = run?.events.findLast(event => event.type === 'clinical');
  const assessment = document.querySelector('#assessment');
  const eventKey = alert ? alert.t + '-' + alert.priority : 'watch';
  if (assessment.dataset.event !== eventKey) {
    assessment.dataset.event = eventKey;
    assessment.innerHTML = '<h2>Assessment</h2><p>' + status(priority(run)) + ' · Scripted demo status</p>'
      + (alert ? '<p><strong>' + alert.title + '</strong></p>' + evidence(alert) : '<p>No scripted clinical alert for this patient in the current replay.</p>');
  }
  document.querySelector('#quality').textContent = run?.probeOff
    ? 'Simulated probe removal. SpO₂ is unavailable and the chart shows a gap.'
    : 'All four simulated signals available. Dashed lines mark demo baselines.';
  document.querySelector('#source-time').textContent = 'Latest source time ' + formatTime(current.t);
}

function monitor() {
  const patient = patients[state.patient];
  const options = patients.map((item, index) => `<option value="${index}" ${index === state.patient ? 'selected' : ''}>${item.id}</option>`).join('');
  view.innerHTML = heading(patient.id, patient.context + ' · Synthetic patient fixture',
    '<label>Select patient<select id="monitor-patient">' + options + '</select></label>') + `
    <div class="detail">
      <section class="stack" aria-label="Vital trends">
        <div class="section-head"><h2>Vital trends</h2><p class="small muted" id="source-time"></p></div>
        <div class="vitals" id="vitals"></div>
        <p class="muted small">Last 15 minutes of source time. Time zero marks the start of replay.</p>
      </section>
      <div class="stack assessment-stack">
        <section class="panel assessment" id="assessment" aria-live="polite"></section>
        <section class="panel"><h2>Signal quality</h2><p id="quality"></p></section>
        <section class="panel"><h2>Partial NEWS2-style subtotal</h2><p>Unavailable in demo. Scoring requires backend assessment output.</p></section>
      </div>
    </div>`;
  paintMonitor();
}

function paintAlerts() {
  const list = document.querySelector('#alert-results');
  const events = (state.run?.events ?? []).filter(event => event.type === state.alertType).slice().reverse();
  const key = state.alertType + ':' + events.length;
  if (list.dataset.key === key) return;
  list.dataset.key = key;
  list.innerHTML = events.map(event => `<article class="panel">
    <h3>${event.title}</h3><p>${patients[state.run.patient].id} · ${event.priority ? status(event.priority) : 'Technical'} · Scripted</p>
    ${evidence(event)}</article>`).join('')
    || '<p class="panel muted">No ' + state.alertType + ' alerts in this replay. Run a scenario to see alert evidence.</p>';
}

function alerts() {
  view.innerHTML = heading('Alert center', 'Review scripted clinical and technical alerts from the current replay.',
    '<button type="button" data-view="replay">Open scenario replay</button>') + `
    <section class="stack" aria-label="Alert queue">
      <div><label style="display:inline-grid">Alert category<select id="alert-type">
        <option value="clinical">Clinical alerts</option><option value="technical">Technical alerts</option>
      </select></label></div>
      <div class="stack" id="alert-results" aria-live="polite"></div>
    </section>`;
  document.querySelector('#alert-type').value = state.alertType;
  paintAlerts();
}

function paintReplay() {
  const run = state.run;
  document.querySelector('#run-status').textContent = run
    ? scenarios[run.scenario] + ' · ' + patients[run.patient].id + ' · ' + run.status
    : 'Ready to start';
  document.querySelector('#progress').value = run?.step ?? 0;
  document.querySelector('#elapsed').textContent = formatTime((run?.step ?? 0) * 30) + ' / 15:00 source time';
  const pause = document.querySelector('#pause');
  pause.disabled = !run || run.status === 'Complete';
  pause.textContent = run?.status === 'Paused' ? 'Resume' : 'Pause';
  document.querySelector('#reset').disabled = !run;
  const timeline = document.querySelector('#timeline');
  const key = run ? String(run.events.length) : 'idle';
  if (timeline.dataset.key !== key) {
    timeline.dataset.key = key;
    timeline.innerHTML = (run?.events ?? []).map(event => '<li><time class="small muted">' + formatTime(event.t) + ' source time</time><strong>' + event.title + '</strong></li>').join('')
      || '<li class="muted">Scripted events will appear here during the replay.</li>';
  }
}

function replay() {
  view.innerHTML = heading('Scenario replay', 'Play 15 minutes of synthetic readings in about 18 seconds.') + `
    <div class="replay">
      <div class="stack">
        <form class="panel stack" id="replay-form">
          <h2>Replay setup</h2>
          <label>Demo patient<select id="replay-patient">${patients.map((patient, i) => `<option value="${i}">${patient.id} · ${patient.context}</option>`).join('')}</select></label>
          <label>Scenario<select id="scenario">${Object.entries(scenarios).map(([key, label]) => `<option value="${key}">${label}</option>`).join('')}</select></label>
          <div class="actions"><button type="submit" class="primary">Start replay</button><button type="button" id="pause">Pause</button><button type="button" id="reset">Reset</button></div>
        </form>
        <section class="panel"><h2>Evaluation results</h2><p>Pending a backend evaluation run. This replay does not measure detection lead time, false alerts, or FHIR persistence.</p></section>
      </div>
      <section class="panel stack">
        <div><h2>Replay timeline</h2><p id="run-status" class="muted" aria-live="polite"></p></div>
        <div><progress id="progress" max="30" value="0" aria-label="Replay progress"></progress><p id="elapsed" class="small"></p></div>
        <ul id="timeline" class="events" aria-live="polite"></ul>
        <button type="button" id="view-replay-patient">Open patient monitoring</button>
      </section>
    </div>`;
  document.querySelector('#replay-patient').value = String(state.patient);
  document.querySelector('#scenario').value = state.scenario;
  paintReplay();
}

const pages = { overview, monitor, alerts, replay };
const painters = { overview: paintOverview, monitor: paintMonitor, alerts: paintAlerts, replay: paintReplay };

function navigate(page, focus = true) {
  state.page = page;
  for (const button of document.querySelectorAll('nav button')) {
    if (button.dataset.view === page) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  }
  pages[page]();
  if (focus) {
    window.scrollTo(0, 0);
    view.querySelector('h1').focus({ preventScroll: true });
  }
}

function tick() {
  const run = state.run;
  const patient = patients[run.patient];
  run.step += 1;
  const t = run.step * 30;
  run.probeOff = run.scenario === 'probe' && run.step >= 8 && run.step < 22;
  const shift = run.scenario === 'slow' ? Math.max(0, (run.step - 3) / 27) : 0;
  const values = reading(patient, shift, run.probeOff);
  run.samples.push({ t, values });

  if (run.scenario === 'slow' && [12, 24].includes(run.step)) {
    const urgent = run.step === 24;
    run.events.push({
      type: 'clinical', priority: urgent ? 'Urgent' : 'Review', t,
      title: urgent ? 'Continued deterioration in demo readings' : 'Change across multiple demo vitals',
      reading: 'SpO₂ ' + values[2] + '%, RR ' + values[1] + ' /min',
      rule: urgent ? 'The replay script escalates to Urgent at 12:00.' : 'The replay script sets Review at 06:00.',
      fact: patient.context + ' · demo SpO₂ baseline ' + patient.baseline[2] + '%',
    });
  }

  if (run.scenario === 'probe' && [8, 22].includes(run.step)) {
    run.events.push({
      type: 'technical', t,
      title: run.probeOff ? 'Simulated probe removed' : 'Simulated probe reattached',
      reading: run.probeOff ? 'SpO₂ unavailable' : 'SpO₂ ' + values[2] + '%',
      rule: 'The replay script changes probe state. This event leaves the scripted clinical priority unchanged.',
      fact: 'Virtual pulse oximeter assigned to ' + patient.id,
    });
  }

  if (run.step === totalSteps) {
    clearInterval(timer);
    run.status = 'Complete';
  }
  painters[state.page]();
}

function startReplay() {
  clearInterval(timer);
  state.run = {
    scenario: state.scenario, patient: state.patient, step: 0, status: 'Running',
    probeOff: false, events: [], samples: initial[state.patient].slice(),
  };
  delete document.querySelector('#timeline').dataset.key;
  paintReplay();
  timer = setInterval(tick, 600);
}

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.view) navigate(button.dataset.view);
  if (button.dataset.patient !== undefined) {
    state.patient = Number(button.dataset.patient);
    navigate('monitor');
  }
  if (button.id === 'view-replay-patient') {
    state.patient = state.run?.patient ?? state.patient;
    navigate('monitor');
  }
  if (button.id === 'pause') {
    if (state.run.status === 'Running') {
      clearInterval(timer);
      state.run.status = 'Paused';
    } else {
      state.run.status = 'Running';
      timer = setInterval(tick, 600);
    }
    paintReplay();
  }
  if (button.id === 'reset') {
    clearInterval(timer);
    state.run = null;
    paintReplay();
    document.querySelector('#replay-form button[type=submit]').focus();
  }
});

view.addEventListener('input', event => {
  if (event.target.id === 'search') {
    state.search = event.target.value;
    paintOverview();
  }
});

view.addEventListener('change', event => {
  const { id, value } = event.target;
  if (id === 'priority') {
    state.priority = value;
    paintOverview();
  }
  if (id === 'alert-type') {
    state.alertType = value;
    paintAlerts();
  }
  if (id === 'monitor-patient') {
    state.patient = Number(value);
    monitor();
    document.querySelector('#monitor-patient').focus();
  }
  if (id === 'replay-patient') state.patient = Number(value);
  if (id === 'scenario') state.scenario = value;
});

view.addEventListener('submit', event => {
  if (event.target.id !== 'replay-form') return;
  event.preventDefault();
  startReplay();
});

navigate('overview', false);
</script>
</body>
</html>
